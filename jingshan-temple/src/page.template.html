  /* 标题 */

  #title .desc{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.75;color:#cdd3d2}

  button:hover{background:rgba(230,195,126,.18);border-color:rgba(230,195,126,.5)}
  button.active{background:rgba(230,195,126,.22);border-color:var(--gold);color:#ffe6b4}
  button:disabled{opacity:.55;cursor:default}
  /* 控制面板 */
  #panel{left:20px;bottom:20px;padding:13px 14px;display:grid;grid-template-columns:repeat(2,minmax(96px,1fr));gap:7px}
  #panel .full{grid-column:1/-1}
  #panel .ttl{grid-column:1/-1;font-size:10px;letter-spacing:.16em;color:var(--gold);margin-bottom:2px}
  /* 右侧操作 */
  #tools{right:20px;bottom:20px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
  #tools .ttl{font-size:10px;letter-spacing:.16em;color:var(--gold);text-align:center}
  #tools .hint{font-size:10.5px;line-height:1.7;color:var(--sub);text-align:center;border-top:1px solid var(--line);padding-top:9px}
  /* 标注 */
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
  .hotspot{position:absolute;transform:translate(-10px,-50%);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .hotspot .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 4px rgba(230,195,126,.25),0 2px 8px rgba(0,0,0,.4);flex:none}
  .hotspot .txt{background:rgba(18,26,31,.86);border:1px solid var(--line);color:#fff4dd;font-size:11px;padding:5px 9px;border-radius:6px;letter-spacing:.03em}
  /* loading */
  #loading{position:fixed;inset:0;z-index:50;background:#a9cbe2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .7s}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .t{font-size:16px;letter-spacing:.28em;color:#33454e}
  #loading .s{font-size:11px;letter-spacing:.12em;color:#5b7079}
  #loading .bar{width:150px;height:2px;background:rgba(51,69,78,.2);overflow:hidden;border-radius:2px}
  #loading .bar i{display:block;width:40%;height:100%;background:#33454e;animation:ld 1.1s infinite ease-in-out}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  @media (max-width:760px){
    #title{top:12px;left:12px;padding:11px 13px;max-width:210px}
    #title h1{font-size:15px}
    #title h1 small{font-size:10px}
    #title .desc{display:none}

    #panel button{font-size:10px;padding:6px 4px}
    #tools{right:12px;bottom:12px;min-width:112px;padding:9px}
    #tools button{font-size:10px;padding:6px}
    #tools .hint{display:none}
  }
</style>
